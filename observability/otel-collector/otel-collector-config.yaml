# W10 metrics Stage 3 — minimal local Collector config. Receives OTLP/HTTP
# from every backend service that has OTEL_EXPORTER_OTLP_ENDPOINT pointed at
# it (libs/tracing/spans.py's own exporter selection — unchanged by this
# file; this is the receiving end, not the sending end), batches, and
# forwards to Tempo's OTLP/gRPC receiver. No other signal type, no other
# exporter: this Collector carries traces only, matching the stage's own
# scope (metrics stay on Prometheus's own scrape path from Stage 1/2; this
# never becomes a second metrics pipeline).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # otlp_grpc, not the bare "otlp" alias: 0.159.0 warns the alias is
  # deprecated (verified against the running container's own startup log).
  otlp_grpc:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc]
