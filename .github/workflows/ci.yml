name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run test
      - run: npm run build

  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway
          - intake-service
          - eligibility-service
          - records-service
          - scheduling-service
          - interop-service
          - roi-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r services/${{ matrix.service }}/requirements.txt
      - name: Import smoke test
        working-directory: services/${{ matrix.service }}
        # Some services (intake-service, eligibility-service) import the shared
        # libs/ package that lives at the repo root, outside the service dir.
        # It's on the path in Docker (copied into /app, see each Dockerfile) and
        # in pytest (conftest.py adds the repo root), but `python -c` from the
        # service dir only puts the cwd on sys.path — so libs.* won't resolve
        # without the repo root here too. Sibling imports (config, check, ...)
        # still resolve via the cwd. No top-level module at the repo root
        # collides with a service's same-named sibling, so this is safe for the
        # services that don't use libs/ as well.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -c "import app; print('${{ matrix.service }} ok')"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        # NOTE: integration tests (marked @pytest.mark.integration) need a live
        # Postgres + Redis and are skipped here. Coverage of the security/auth
        # paths is thin — tracked in RIV-201.
        run: pytest -m "not integration" -q
      - name: Retrieval quality gate (deterministic, no paid provider)
        # W10 Final Stage 5 sub-slice 4: the approved 28-case client gold set
        # against KeywordPolicyRetriever only — never real Bedrock/pgvector,
        # which stays db/policy_corpus_evaluate.py's separate, credentialed,
        # manually-run command.
        run: python db/policy_retrieval_gate.py

  # W10 Final Stage 2: proves the scheduling (RIV-175), ROI, audit-chain, and
  # agent-draft database-level concurrency invariants under a REAL Postgres —
  # not the full docker-compose stack (no gateway/redis/other services), and
  # not the entire integration suite (most of which needs that full stack).
  # Reuses docker-compose.yml's own postgres service (same init scripts, same
  # schema.sql/seed.sql) so schema bootstrap is never reimplemented here.
  concurrency-tests:
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Start a disposable Postgres (real schema + seed, no other service)
        # No .env file exists in this checkout (untracked, gitignored) — same
        # "generate a throwaway value, never assume a committed secret"
        # posture as the docker-build job below. DB_USER/DB_NAME are not
        # secret, so they're plain values here rather than generated.
        run: |
          set -euo pipefail
          export DB_USER=riverbend_app
          export DB_NAME=riverbend
          export DB_PASSWORD="$(openssl rand -hex 32)"
          export DB_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          export INTERNAL_SERVICE_TOKEN="$(openssl rand -hex 32)"
          export PHI_ACTIVE_KEY_VERSION=v1
          export PHI_ENCRYPTION_KEY_V1="$(openssl rand -base64 32)"
          export PHI_BLIND_INDEX_KEY_V1="$(openssl rand -base64 32)"
          {
            echo "DB_USER=$DB_USER"
            echo "DB_NAME=$DB_NAME"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "DB_ADMIN_PASSWORD=$DB_ADMIN_PASSWORD"
          } >> "$GITHUB_ENV"
          docker compose up -d --wait postgres
      - name: Run the selected concurrency-defining integration tests
        env:
          DB_HOST: localhost
          DB_ADMIN_USER: riverbend_admin
        run: |
          pytest -m integration -q \
            tests/integration/test_scheduling_concurrency_db.py \
            tests/integration/test_roi_fulfillment_concurrency_db.py \
            tests/integration/test_disclosures_roi_request_unique_migration.py \
            tests/integration/test_audit_logs_hash_chain.py \
            tests/integration/test_agent_draft_provenance_contract.py \
            tests/integration/test_agent_lifecycle_events_migration.py \
            tests/integration/test_bedrock_usage_events_migration.py

  # W10 Final 2 Stage 4: bounded full-stack startup and integration
  # verification. Unlike concurrency-tests above (Postgres only), this job
  # brings up the WHOLE normal docker-compose stack — every service, the
  # gateway, redis — on a disposable, uniquely-named Compose project with
  # freshly generated ephemeral secrets, and never sets any AWS/Bedrock or
  # payer credential: eligibility-service's PAYER_INTEGRATION_MODE defaults
  # to "simulation" when unset (zero outbound payer calls by construction),
  # and nothing in the selected smoke path below calls Bedrock — see
  # tests/integration/test_full_stack_smoke.py's own module docstring for
  # exactly why each of its steps is real-provider-call-free. This proves
  # cross-service startup/wiring, not the historical integration suite
  # (deliberately the smallest representative walk, per this stage's own
  # scope).
  full-stack-verification:
    runs-on: ubuntu-latest
    needs: [tests]
    env:
      # Unique per run so teardown can never affect a developer's own
      # jf-riverbend-portal_* resources, another concurrent CI run, or (if
      # this workflow is ever adjusted to run on a schedule) a prior run's
      # leftover volume.
      COMPOSE_PROJECT_NAME: riverbend-fsv-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r requirements-dev.txt
      - name: Generate ephemeral secrets (never the developer's .env, never a paid-provider credential)
        # Same generation pattern as concurrency-tests/docker-build above —
        # a fresh, throwaway value per run, never printed. Deliberately does
        # NOT set AWS_REGION/AWS_BEARER_TOKEN_BEDROCK/PAYER_API_KEY/
        # PAYER_API_URL/POLICY_EMBEDDING_MODEL_ID: this job must never be
        # able to make a real Bedrock or payer call, by construction rather
        # than by trusting every step below to remember not to.
        run: |
          set -euo pipefail
          {
            echo "DB_USER=riverbend_app"
            echo "DB_NAME=riverbend"
            echo "DB_PASSWORD=$(openssl rand -hex 32)"
            echo "DB_ADMIN_USER=riverbend_admin"
            echo "DB_ADMIN_PASSWORD=$(openssl rand -hex 32)"
            echo "INTERNAL_SERVICE_TOKEN=$(openssl rand -hex 32)"
            echo "PHI_ACTIVE_KEY_VERSION=v1"
            echo "PHI_ENCRYPTION_KEY_V1=$(openssl rand -base64 32)"
            echo "PHI_BLIND_INDEX_KEY_V1=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - name: Validate Compose configuration
        run: docker compose config -q
      - name: Build affected images
        run: docker compose build
      - name: Start the normal stack and wait for health (bounded timeout)
        run: docker compose up -d --wait --wait-timeout 240
      - name: Assert no container is unhealthy
        if: always()
        run: |
          set -euo pipefail
          docker compose ps --format json > /tmp/fsv-ps.json
          python3 -c "
          import json
          unhealthy = []
          with open('/tmp/fsv-ps.json') as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  c = json.loads(line)
                  health = c.get('Health', '')
                  if health and health != 'healthy':
                      unhealthy.append((c['Service'], c['State'], health))
          for service, state, health in unhealthy:
              print(f'UNHEALTHY: {service} state={state} health={health}')
          if unhealthy:
              raise SystemExit(f'{len(unhealthy)} service(s) not healthy — see above')
          print('all health-checked services are healthy')
          "
      - name: Warm up — confirm Postgres actually serves real queries, not just pg_isready
        # Every service's own /healthz only proves the process answers HTTP —
        # it never touches the database — and postgres's own healthcheck
        # (pg_isready) can report ready moments before its two-phase startup
        # (initdb, then one internal restart) has fully settled from a fresh
        # volume, on a resource-constrained CI runner starting every service
        # at once. Observed here as a sustained (30+ second) OperationalError
        # on gateway's first real query even though `--wait` had already
        # reported every container healthy. A first attempt at probing this
        # via gateway's own POST /login instead hit its login rate limiter
        # (10 attempts per username per 5 minutes) well before the DB
        # settled, self-defeating the retry — this probes Postgres directly
        # instead, with a real query (not just a liveness ping), so it can
        # retry as many times as it needs without side effects.
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if docker compose exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT 1" >/tmp/warmup.log 2>&1; then
              echo "postgres is serving real queries (attempt $i)"
              exit 0
            fi
            echo "attempt $i: postgres not yet serving real queries — retrying"
            sleep 2
          done
          echo "postgres never started serving real queries within the bounded retry window"
          cat /tmp/warmup.log
          exit 1
      - name: Verify fresh schema/bootstrap and role separation
        # Proves the auto-seed-on-a-fresh-volume path (docker-entrypoint-
        # initdb.d, see docs/runbook.md "First-boot data") actually ran, and
        # that the admin/runtime role split (migration 028) took effect —
        # the runtime role must NOT be able to create a schema object.
        run: |
          set -euo pipefail
          PATIENT_COUNT=$(docker compose exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT count(*) FROM patients")
          if [ "$PATIENT_COUNT" -lt 1 ]; then
            echo "expected the seeded patients table to be non-empty on a fresh volume, found $PATIENT_COUNT"
            exit 1
          fi
          echo "seeded patients: $PATIENT_COUNT"
          if docker compose exec -T postgres psql -U "$DB_USER" -d "$DB_NAME" -c "CREATE TABLE fsv_role_probe (id INT)" >/tmp/role-probe.log 2>&1; then
            echo "the runtime role must not be able to CREATE TABLE — role separation (migration 028) did not take effect"
            exit 1
          fi
          grep -qi "permission denied" /tmp/role-probe.log
          echo "runtime/admin role separation confirmed"
      - name: Exercise the demo-reset path
        run: make demo-reset
      - name: RAG preparation — configuration failure (no real-provider credential configured)
        # Must fail closed before any network call, with a categorical
        # message naming the missing variables — never a secret value (there
        # is none to leak here; none of AWS_REGION/POLICY_EMBEDDING_MODEL_ID
        # were ever set in this job's environment).
        run: |
          set -euo pipefail
          if docker compose exec -T records-service python3 db/policy_corpus_prepare.py >/tmp/rag-config-failure.log 2>&1; then
            echo "expected db/policy_corpus_prepare.py to fail closed with no POLICY_EMBEDDING_MODEL_ID/AWS_REGION configured"
            cat /tmp/rag-config-failure.log
            exit 1
          fi
          grep -q "missing or placeholder configuration" /tmp/rag-config-failure.log
          echo "RAG preparation correctly refused to run with no real-provider configuration"
      - name: RAG preparation — deterministic provider/test boundary
        env:
          DB_HOST: localhost
        run: |
          pytest -m integration -q \
            tests/integration/test_policy_corpus_pipeline.py \
            tests/integration/test_policy_corpus_prepare_idempotency.py
      - name: Minimal authorized path across every service
        env:
          GATEWAY_URL: http://localhost:8070
        run: pytest -m integration -q tests/integration/test_full_stack_smoke.py
      - name: Sanitized diagnostics on failure
        if: failure()
        # Container stdout/stderr never carries a full secret value by
        # design (PHISafeFilter, and no service logs its own configured
        # credentials) — this is standard categorical CI diagnostic output,
        # not a raw secret dump.
        run: |
          docker compose ps
          docker compose logs --no-color --tail=50
      - name: Tear down the disposable project and its volumes
        if: always()
        # Scoped to THIS run's unique COMPOSE_PROJECT_NAME only — never a
        # developer's own stack or another run's.
        run: docker compose down -v --remove-orphans

  # P5 (w8-planner-2): dependency vulnerability, secret, and container-image
  # scanning. Severity/failure policy, applied consistently across all three
  # via Trivy: CRITICAL/HIGH vulnerabilities fail the build (MEDIUM/LOW are
  # reported but non-blocking); any secret finding fails the build outright
  # — a leaked credential has no "low severity" tier. `--ignore-unfixed` on
  # the vuln scans so CI doesn't block on an advisory with no available fix
  # yet. Runs a version-pinned `ghcr.io/aquasecurity/trivy` image directly
  # via `docker run`, not the `aquasecurity/trivy-action` marketplace
  # action: that action's v0.28.0 release resolves an internal
  # `aquasecurity/setup-trivy` sub-action version this environment cannot
  # download, failing the job before any scan runs.
  #
  # .trivyignore.*.yaml files are a TEMPORARY, narrow baseline for specific
  # pre-existing findings — see each file's own header for what it covers,
  # why, and its expiry (2026-09-02 for all of them). Every entry is scoped
  # to an exact id + purls/paths; nothing outside that exact scope is
  # suppressed. The remaining frontend-image baseline is validated before
  # use so a malformed file fails the build rather than silently ignoring
  # nothing (or, worse, erroring past `--ignorefile` in a way that skips the
  # flag). `paths` is
  # optional here (not every entry uses it — OS-package findings are scoped
  # by `purls` instead, since Trivy has no file path for a dpkg entry), but
  # `id`, a nonempty `purls` or `paths`, `statement`, and `expired_at` are
  # always required.
  validate-ignore-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Validate .trivyignore.*.yaml are well-formed
        run: |
          python3 -c "
          import sys, yaml
          files = (
              '.trivyignore.frontend-image.yaml',
          )
          for path in files:
              with open(path) as f:
                  data = yaml.safe_load(f)
              if not isinstance(data, dict) or not isinstance(data.get('vulnerabilities'), list):
                  print(f'{path}: missing a top-level vulnerabilities: list', file=sys.stderr)
                  sys.exit(1)
              if not data['vulnerabilities']:
                  print(f'{path}: vulnerabilities: list is empty', file=sys.stderr)
                  sys.exit(1)
              for entry in data['vulnerabilities']:
                  for required in ('id', 'statement', 'expired_at'):
                      if required not in entry:
                          print(f'{path}: entry {entry} missing required field {required!r}', file=sys.stderr)
                          sys.exit(1)
                  if not entry.get('purls') and not entry.get('paths'):
                      print(f'{path}: entry {entry} has neither purls nor paths -- refusing an unscoped, blanket ignore', file=sys.stderr)
                      sys.exit(1)
              print(f'{path}: {len(data[\"vulnerabilities\"])} entries, well-formed')
          "

  dependency-scan:
    runs-on: ubuntu-latest
    needs: [validate-ignore-files]
    steps:
      - uses: actions/checkout@v4
      - name: Dependency vulnerability scan (fails on CRITICAL/HIGH)
        # No ignorefile: the frontend npm findings this once carried
        # (.trivyignore.deps.yaml) were fully remediated (P5 follow-up,
        # item 1 — next/postcss/nanoid/sharp upgrades) and the file
        # deleted, not left empty or expired-out.
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/aquasecurity/trivy:0.74.0 \
            fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 /repo

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (any finding fails)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/aquasecurity/trivy:0.74.0 \
            fs --scanners secret --exit-code 1 /repo

  docker-build:
    runs-on: ubuntu-latest
    needs: [frontend, services, tests, validate-ignore-files]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        # Round-17 review (2026-08-06, PR #20): docker-compose.yml requires
        # INTERNAL_SERVICE_TOKEN (gateway/intake-service/records-service all
        # fail `docker compose config`/`build` immediately without it — see
        # docs/runbook.md § Required one-time setup).
        #
        # Round-18 review: passing only secrets.INTERNAL_SERVICE_TOKEN broke
        # CI for exactly the contexts that most need build coverage — GitHub
        # never exposes repository secrets to pull_request runs from forks,
        # and an unconfigured secret also expands to "" either way, so any
        # external contributor's PR (or any repo that hasn't set this
        # secret) silently lost docker-build entirely. This build-only step
        # never starts a container or serves a real request — it only needs
        # *some* value that satisfies docker-compose.yml's presence/length
        # check — so fall back to a freshly generated, throwaway value when
        # the real secret isn't available, and only ever use the real
        # secret when one is configured. Actual deployments still get the
        # real secret via env_file: .env, untouched by this fallback.
        #
        # 2026-08-20 (C2): DB_PASSWORD joined the same category. `.env` used to
        # be committed, so compose interpolation quietly resolved it from the
        # tracked file; untracking `.env` made this step fail, which is the
        # fail-fast doing its job — it found a place that depended on a
        # committed secret. Same throwaway-value treatment, same reasoning: this
        # step builds images and never starts a container, so it needs *a*
        # value, not the real one.
        #
        # P3 role separation (w8-planner-2, AUD-B01): DB_ADMIN_PASSWORD joined
        # the same category when docker-compose.yml made it a required
        # ${VAR:?} with no fallback (test_secrets_hygiene.py::
        # test_ci_supplies_every_variable_compose_requires enforces this stays
        # in sync). Each var in this loop gets its OWN independent
        # `openssl rand -hex 32` value when no repository secret is
        # configured, so DB_ADMIN_PASSWORD and DB_PASSWORD end up distinct —
        # satisfying db/docker-init/00-create-app-role.sh's equal-password
        # guard, though that guard cannot even run here: this step only
        # builds images, it never starts a container.
        #
        # w8-planner-2 P2 (adr/0012): PHI_ACTIVE_KEY_VERSION/
        # PHI_ENCRYPTION_KEY_V1/PHI_BLIND_INDEX_KEY_V1 joined the same
        # category the moment docker-compose.yml made them required
        # ${VAR:?} on intake-service/records-service. Unlike the generic
        # hex-secret loop below: PHI_ENCRYPTION_KEY_V1 and
        # PHI_BLIND_INDEX_KEY_V1 are generated as real base64-encoded
        # 32-byte values (matching EnvKeyProvider's actual format,
        # libs/phi_crypto/keys.py) — each its own independent
        # `openssl rand -base64 32` call, never derived from the other —
        # and PHI_ACTIVE_KEY_VERSION is a plain identifier, not a secret,
        # so its throwaway fallback is the literal "v1", not random noise.
        # No CI step here ever runs `docker compose up` (only `build` and
        # `config`, plus `docker run` directly against built images for
        # scanning — never a running container), so EnvKeyProvider's own
        # validation never actually executes in CI either way; these are
        # realistic-shaped throwaway values on principle, not because a
        # step depends on it today.
        run: |
          set -euo pipefail
          for var in INTERNAL_SERVICE_TOKEN DB_PASSWORD DB_ADMIN_PASSWORD; do
            if [ -n "$(eval "echo \"\${$var:-}\"")" ]; then
              echo "Using $var from repository secret."
            else
              echo "No $var secret available (e.g. a fork PR) — generating a throwaway build-only value."
              export "$var=$(openssl rand -hex 32)"
            fi
            # Persisted to $GITHUB_ENV (not just this step's shell) so the
            # container-scan step below can run `docker compose config`
            # too — compose requires all of these as ${VAR:?} regardless of
            # which step asks.
            echo "$var=$(eval "echo \"\${$var}\"")" >> "$GITHUB_ENV"
          done
          if [ -n "${PHI_ACTIVE_KEY_VERSION:-}" ]; then
            echo "Using PHI_ACTIVE_KEY_VERSION from repository secret."
          else
            echo "No PHI_ACTIVE_KEY_VERSION secret available — defaulting to v1."
            export PHI_ACTIVE_KEY_VERSION=v1
          fi
          echo "PHI_ACTIVE_KEY_VERSION=$PHI_ACTIVE_KEY_VERSION" >> "$GITHUB_ENV"
          for var in PHI_ENCRYPTION_KEY_V1 PHI_BLIND_INDEX_KEY_V1; do
            if [ -n "$(eval "echo \"\${$var:-}\"")" ]; then
              echo "Using $var from repository secret."
            else
              echo "No $var secret available — generating an independent throwaway base64-encoded 32-byte value."
              export "$var=$(openssl rand -base64 32)"
            fi
            echo "$var=$(eval "echo \"\${$var}\"")" >> "$GITHUB_ENV"
          done
          docker compose build
        env:
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          PHI_ACTIVE_KEY_VERSION: ${{ secrets.PHI_ACTIVE_KEY_VERSION }}
          PHI_ENCRYPTION_KEY_V1: ${{ secrets.PHI_ENCRYPTION_KEY_V1 }}
          PHI_BLIND_INDEX_KEY_V1: ${{ secrets.PHI_BLIND_INDEX_KEY_V1 }}
      - name: Split built vs. third-party images
        # `docker compose config --images <service-list>` does NOT actually
        # restrict output to those services (confirmed empirically — it
        # still returns postgres/redis regardless of which services are
        # named), so filtering happens against the parsed JSON config
        # instead: any service with a `build:` key is ours; anything else
        # (postgres, redis) is a pinned third-party image we don't build
        # and can't patch by editing this repo. Built images have no static
        # `image:` name in the config (compose assigns one at build time),
        # so it's reconstructed as `<project>-<service>` using the SAME
        # project name compose itself resolved (`.name` in the JSON) —
        # not an assumption about the checkout directory.
        #
        # set -euo pipefail so a failing `docker compose config` fails this
        # step instead of silently producing empty lists; both lists are
        # then explicitly checked non-empty for the same reason a prior
        # false-green already taught this workflow — don't let "scanned
        # zero images" report success.
        run: |
          set -euo pipefail
          docker compose config --format json > /tmp/compose-config.json
          python3 -c "
          import json
          data = json.load(open('/tmp/compose-config.json'))
          project = data['name']
          built = sorted(f'{project}-{name}' for name, svc in data['services'].items() if 'build' in svc)
          thirdparty = sorted(svc['image'] for name, svc in data['services'].items() if 'build' not in svc)
          if not built:
              raise SystemExit('no built services found in compose config — refusing to report success')
          if not thirdparty:
              raise SystemExit('no third-party services found in compose config — refusing to report success')
          open('/tmp/built-images.txt', 'w').write('\n'.join(built) + '\n')
          open('/tmp/thirdparty-images.txt', 'w').write('\n'.join(thirdparty) + '\n')
          print('built:', built)
          print('third-party:', thirdparty)
          "
      - name: Container image scan — repo-built images (fails on CRITICAL/HIGH)
        # Blocking, per Option 2: this repo can actually fix a finding here
        # (a dependency bump, a base-image pin), unlike a vendor's own base
        # image. frontend still carries .trivyignore.frontend-image.yaml
        # (4 findings vendored inside npm's own CLI, no fix published yet
        # — P5 follow-up, item 1). The 7 Python-based backend images need
        # no ignorefile at all: item 3 (pinning python:3.12-slim-bookworm
        # instead of the floating, trixie-resolving python:3.12-slim)
        # resolved every finding they used to share.
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            echo "Scanning (blocking) $image ..."
            extra_args=()
            case "$image" in
              *-frontend) extra_args+=(--ignorefile /repo/.trivyignore.frontend-image.yaml) ;;
            esac
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache/ \
              -v "$PWD:/repo" \
              ghcr.io/aquasecurity/trivy:0.74.0 image \
              --severity CRITICAL,HIGH --ignore-unfixed \
              "${extra_args[@]+"${extra_args[@]}"}" --exit-code 1 "$image"
          done < /tmp/built-images.txt
      - name: Container image scan — third-party images (report-only)
        # NOT blocking, per Option 2: postgres/redis are pinned, unbuilt
        # vendor images (docker-compose.yml) — a finding here can't be
        # fixed by changing code in this repo, only by bumping the pinned
        # tag (tracked separately; pgvector 0.8.6 evaluation is its own
        # remediation item, not done in this PR). No --ignorefile and no
        # --exit-code: every finding is left fully visible in the table
        # output below AND in the uploaded JSON artifact — nothing here is
        # suppressed, only non-blocking. A scanner/operational failure
        # (bad pull, Trivy crash) still fails this step: `docker run`
        # itself still exits non-zero for those regardless of --exit-code,
        # which only controls the "vulnerabilities found" exit path —
        # confirmed empirically against a nonexistent image.
        run: |
          set -euo pipefail
          mkdir -p /tmp/thirdparty-scan-results
          while IFS= read -r image; do
            echo "Scanning (report-only) $image ..."
            safe_name="$(echo "$image" | tr '/:' '__')"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache/ \
              ghcr.io/aquasecurity/trivy:0.74.0 image \
              --severity CRITICAL,HIGH "$image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache/ \
              ghcr.io/aquasecurity/trivy:0.74.0 image \
              --severity CRITICAL,HIGH --format json "$image" \
              > "/tmp/thirdparty-scan-results/${safe_name}.json"
          done < /tmp/thirdparty-images.txt
      - uses: actions/upload-artifact@v4
        with:
          name: thirdparty-image-scan-results
          path: /tmp/thirdparty-scan-results/
          retention-days: 30
