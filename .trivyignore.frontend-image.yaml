# Temporary, narrow vulnerability baseline (P5 follow-up, item 1 remediation).
#
# All findings vendored inside node:22-slim's own bundled npm CLI (used for
# npm's package integrity/provenance verification) - not this project's own
# dependency tree. Item 1 already bumped the Dockerfile's npm to 12.0.2
# (frontend/Dockerfile), which resolved sigstore and picomatch entirely and
# reduced brace-expansion/ip-address/tar from 3/1/3 findings to 2/1/1. No
# newer npm CLI release exists yet with fixes for these (very recently
# disclosed relative to 12.0.2's own release, per Trivy's own scan output —
# each still names a real fixed version, just not yet in a published npm).
#
# Renewed 2026-09-01: `npm view npm version` confirms 12.0.2 is STILL the
# latest published npm release, and the findings remain limited to npm's
# own bundled CLI (frontend/Dockerfile's own dependency tree is unaffected).
# This is a short renewal, not an indefinite exception — expiry moves from
# 2026-09-02 to 2026-09-16 only, same four exact CVE ids/purls, nothing
# broadened. Remove this file the moment npm publishes a release with these
# fixes; re-check `npm view npm version` before renewing again.
#
# Malformed YAML here must fail CI - see the validate-ignore-files job.
vulnerabilities:
