# Temporary, narrow vulnerability baseline (P5 follow-up).
#
# Every entry below is pre-existing (found the moment dependency-scan was
# added, not introduced by it), fixable (a fixed version exists per Trivy's
# own scan output), and temporary: remediation is a scoped, separate change
# (upgrade next/postcss/sharp/nanoid in frontend/package.json), tracked to land
# and this file deleted before 2026-09-02. CRITICAL/HIGH findings NOT listed here
# still fail the build - this is not a blanket suppression.
#
# Scoped by package PURL (not file path): this file is reused, merged with
# .trivyignore.frontend-image.yaml at scan time, for the frontend CONTAINER
# image scan too - a path scoped to frontend/package-lock.json would not match
# that scan's differently-rooted target, but a package identity does.
#
# Malformed YAML here must fail CI - see the validate-ignore-files job.
