services:
  postgres:
    # pgvector/pgvector:0.8.6-pg15 is a drop-in postgres:15 build with the
    # pgvector extension pre-installed (see db/migrations/010_pgvector_embeddings.sql,
    # adr/0006) — no other change to how Postgres runs here. Bumped from
    # 0.8.0-pg15 (P5 follow-up, item 4): a patch-level pgvector bump, same
    # HNSW/vector_cosine_ops API this schema already uses (stable since
    # pgvector 0.5.0) — verified via a fresh install + the rag_corpus/
    # pgvector integration tests. Trivy: 131 findings -> 22, all remaining
    # in usr/local/bin/gosu (pgvector's own vendored binary, unrelated to
    # Postgres/pgvector itself) — report-only third-party scan, tracked
    # upstream, not this repo's to fix directly.
    image: pgvector/pgvector:0.8.6-pg15
    environment:
      POSTGRES_DB: ${DB_NAME:-riverbend}
      # Admin/runtime role separation (P3 AUD-B01, w8-planner-2): the
      # cluster's bootstrap role — which the official Postgres image always
      # makes a superuser, and which therefore owns everything schema.sql
      # creates — is now the ADMIN account, not the app's own runtime
      # credential. Fixes riverbend_app being able to `ALTER TABLE
      # audit_logs DISABLE TRIGGER ...` on a table it owned, bypassing 026's
      # append-only guard outright. See
      # db/migrations/028_admin_runtime_role_separation.sql for the
      # existing-volume transition and db/docker-init/00-create-app-role.sh
      # for how riverbend_app itself gets created on a fresh one.
      POSTGRES_USER: ${DB_ADMIN_USER:-riverbend_admin}
      # No `:-changeme` default, same reasoning as DB_PASSWORD below — and
      # (round 2 review) NO fallback to DB_PASSWORD either: sharing a
      # secret between the admin and runtime roles would let anyone who
      # already knows the runtime credential authenticate AS the admin
      # role too, defeating the privilege split this whole PR exists for.
      # Must be set to its own distinct value; docker-init/00-create-app-
      # role.sh and db/migrations/scripts/create_admin_role.sql both also
      # refuse to run if this equals DB_PASSWORD.
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD must be set in .env to a value DISTINCT from DB_PASSWORD — generate one with `openssl rand -hex 32`; see docs/runbook.md}
      # Read by \getenv in db/docker-init/00-create-app-role.sh and
      # db/migrations/028_admin_runtime_role_separation.sql — never passed
      # as a psql -v variable or command-line argument, so neither value is
      # ever visible in `ps`, shell history, or process logs. Same DB_USER/
      # DB_ADMIN_USER every service/script already resolves — not secret,
      # kept alongside the passwords only for a uniform \getenv pattern.
      DB_ADMIN_USER: ${DB_ADMIN_USER:-riverbend_admin}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD must be set in .env to a value DISTINCT from DB_PASSWORD — generate one with `openssl rand -hex 32`; see docs/runbook.md}
      DB_APP_USER: ${DB_USER:-riverbend_app}
      DB_APP_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env — copy .env.example and set a real value; see docs/runbook.md}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/docker-init/00-create-app-role.sh:/docker-entrypoint-initdb.d/00-create-app-role.sh:ro
      - ./db/docker-init/01-run-schema.sh:/docker-entrypoint-initdb.d/01-run-schema.sh:ro
      # schema.sql now needs \getenv DB_APP_USER (round-3 review — no
      # hard-coded role name), which docker-entrypoint-initdb.d's own
      # built-in .sql handling can't supply — mounted OUTSIDE that
      # directory (not a NN-name.sql path) so it is never auto-executed a
      # second time; 01-run-schema.sh above is the wrapper that actually
      # invokes psql -f against it.
      - ./db/schema.sql:/docker-entrypoint-initdb.d-src/schema.sql:ro
      - ./db/seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-riverbend_app} -d ${DB_NAME:-riverbend}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    # Host port unpublished (2026-08-20, client target "datastore ports
    # unpublished"). Nothing needs it: every consumer resolves
    # redis://redis:6379 by compose service name, and the healthcheck runs
    # inside the container. Postgres is a separate case — see the
    # port-exposure test for why it is still published.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    # Build context is the repo root (not ./services/gateway) so the Dockerfile
    # can COPY config/roles.yaml — the live RBAC permission source, which lives
    # outside the service directory. Same pattern as intake-service,
    # eligibility-service and records-service below.
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file:
      # Optional on purpose. `.env` is no longer tracked (adr/0007), so a clean
      # clone does not have one — and a missing env_file is a HARD compose
      # error that fires before any `${VAR:?}` guard, producing "env file not
      # found" instead of the message naming the variable to set. Marking it
      # optional keeps the ${VAR:?} guards as the real fail-fast.
      - path: .env
        required: false
    environment:
      # Round-17 review (2026-08-06): fails `docker compose config`/`up`
      # immediately with this message if unset, rather than starting a
      # container that then fails at its own startup (services/gateway/
      # app.py's lifespan check) or, before round-17, sat "unhealthy" until
      # the healthcheck's retry budget ran out. See docs/runbook.md's
      # "Required one-time setup" section.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env — see docs/runbook.md § Required one-time setup}
      INTAKE_URL: http://intake-service:8071
      ELIGIBILITY_URL: http://eligibility-service:8072
      RECORDS_URL: http://records-service:8073
      SCHEDULING_URL: http://scheduling-service:8074
      INTEROP_URL: http://interop-service:8075
      ROI_URL: http://roi-service:8076
    ports:
      - "8070:8070"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      intake-service:
        condition: service_started
      records-service:
        condition: service_started
      scheduling-service:
        condition: service_started
      roi-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8070/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  intake-service:
    # Stage 3: build context is the repo root (not ./services/intake-service)
    # so the Dockerfile can COPY libs/ (libs.tracing) in alongside this
    # service's own files — see services/intake-service/Dockerfile and
    # adr/0005-eligibility-agent-runtime-and-resilience.md.
    build:
      context: .
      dockerfile: services/intake-service/Dockerfile
    env_file:
      # Optional on purpose. `.env` is no longer tracked (adr/0007), so a clean
      # clone does not have one — and a missing env_file is a HARD compose
      # error that fires before any `${VAR:?}` guard, producing "env file not
      # found" instead of the message naming the variable to set. Marking it
      # optional keeps the ${VAR:?} guards as the real fail-fast.
      - path: .env
        required: false
    environment:
      # Round-17 review (2026-08-06): see gateway's identical entry above.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env — see docs/runbook.md § Required one-time setup}
      ELIGIBILITY_URL: http://eligibility-service:8072
      # w8-planner-2 P2 (adr/0012): this service encrypts ssn/dob/notes at
      # intake time (libs/phi_crypto). Only intake-service and
      # records-service receive these — see adr/0012 "which services hold
      # keys" for why every other service gets neither the dependency nor
      # the key material.
      PHI_ACTIVE_KEY_VERSION: ${PHI_ACTIVE_KEY_VERSION:?PHI_ACTIVE_KEY_VERSION must be set in .env — see adr/0012}
      PHI_ENCRYPTION_KEY_V1: ${PHI_ENCRYPTION_KEY_V1:?PHI_ENCRYPTION_KEY_V1 must be set in .env — see adr/0012}
      PHI_BLIND_INDEX_KEY_V1: ${PHI_BLIND_INDEX_KEY_V1:?PHI_BLIND_INDEX_KEY_V1 must be set in .env — see adr/0012}
    ports:
      - "8071:8071"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8071/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  eligibility-service:
    # Stage 3: build context is the repo root (not ./services/eligibility-service)
    # so the Dockerfile can COPY libs/ (libs.tracing, libs.eligibility_agent,
    # libs.safe_logging, libs.llm_client) in alongside this service's own
    # files — see services/eligibility-service/Dockerfile and
    # adr/0005-eligibility-agent-runtime-and-resilience.md.
    build:
      context: .
      dockerfile: services/eligibility-service/Dockerfile
    env_file:
      # Optional on purpose. `.env` is no longer tracked (adr/0007), so a clean
      # clone does not have one — and a missing env_file is a HARD compose
      # error that fires before any `${VAR:?}` guard, producing "env file not
      # found" instead of the message naming the variable to set. Marking it
      # optional keeps the ${VAR:?} guards as the real fail-fast.
      - path: .env
        required: false
    environment:
      # Branch 7: this service now verifies that a call came through the
      # gateway. Deliberately NOT in the committed .env — it is a secret,
      # and the ${VAR:?...} form makes a missing value stop compose rather
      # than start a service that 401s every real request.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env — see docs/runbook.md § Required one-time setup}
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8072/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  records-service:
    # Stage 3: build context is the repo root (not ./services/records-service)
    # so the Dockerfile can COPY libs/ (libs.patient_view_agent,
    # libs.safe_logging) in alongside this service's own files — see
    # services/records-service/Dockerfile.
    build:
      context: .
      dockerfile: services/records-service/Dockerfile
    env_file:
      # Optional on purpose. `.env` is no longer tracked (adr/0007), so a clean
      # clone does not have one — and a missing env_file is a HARD compose
      # error that fires before any `${VAR:?}` guard, producing "env file not
      # found" instead of the message naming the variable to set. Marking it
      # optional keeps the ${VAR:?} guards as the real fail-fast.
      - path: .env
        required: false
    environment:
      # Round-17 review (2026-08-06): see gateway's identical entry above.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env — see docs/runbook.md § Required one-time setup}
      # w8-planner-2 P2 (adr/0012): this service decrypts ssn/dob/notes on
      # every patient read (libs/phi_crypto) — see intake-service's
      # identical entry above and adr/0012 "which services hold keys".
      PHI_ACTIVE_KEY_VERSION: ${PHI_ACTIVE_KEY_VERSION:?PHI_ACTIVE_KEY_VERSION must be set in .env — see adr/0012}
      PHI_ENCRYPTION_KEY_V1: ${PHI_ENCRYPTION_KEY_V1:?PHI_ENCRYPTION_KEY_V1 must be set in .env — see adr/0012}
      PHI_BLIND_INDEX_KEY_V1: ${PHI_BLIND_INDEX_KEY_V1:?PHI_BLIND_INDEX_KEY_V1 must be set in .env — see adr/0012}
    ports:
      - "8073:8073"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8073/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  scheduling-service:
    # OBS-M02 discovered during Stage 7 smoke testing: this service imports
    # libs/ (libs.safe_logging, and Stage 6's libs.metrics), which lives at
    # the repo root — the old per-service build context could never see it.
    # The image built fine (COPY . . just copies this directory), but the
    # container crashed at startup with ModuleNotFoundError, invisible to
    # CI (which only builds images, never starts them) and to pytest
    # (which imports directly from the repo checkout). Same fix already
    # applied to gateway/intake-service/eligibility-service/records-service
    # — see services/scheduling-service/Dockerfile.
    build:
      context: .
      dockerfile: services/scheduling-service/Dockerfile
    env_file:
      # Optional on purpose. `.env` is no longer tracked (adr/0007), so a clean
      # clone does not have one — and a missing env_file is a HARD compose
      # error that fires before any `${VAR:?}` guard, producing "env file not
      # found" instead of the message naming the variable to set. Marking it
      # optional keeps the ${VAR:?} guards as the real fail-fast.
      - path: .env
        required: false
    environment:
      # Branch 7: this service now verifies that a call came through the
      # gateway. Deliberately NOT in the committed .env — it is a secret,
      # and the ${VAR:?...} form makes a missing value stop compose rather
      # than start a service that 401s every real request.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env — see docs/runbook.md § Required one-time setup}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8074/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  interop-service:
    # OBS-M02 discovered during Stage 7 smoke testing — see the identical
    # comment on scheduling-service above. This service has imported
    # libs.safe_logging since Stage 3; the bug predates Stage 6.
    build:
      context: .
      dockerfile: services/interop-service/Dockerfile
    env_file:
      # Optional on purpose. `.env` is no longer tracked (adr/0007), so a clean
      # clone does not have one — and a missing env_file is a HARD compose
      # error that fires before any `${VAR:?}` guard, producing "env file not
      # found" instead of the message naming the variable to set. Marking it
      # optional keeps the ${VAR:?} guards as the real fail-fast.
      - path: .env
        required: false
    environment:
      # Branch 7B: this service now verifies that a call came through the
      # gateway. Deliberately NOT in the committed .env — it is a secret, and
      # the ${VAR:?...} form makes a missing value stop compose rather than
      # start a service that 401s every real request.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env — see docs/runbook.md § Required one-time setup}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8075/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  roi-service:
    # OBS-M02 discovered during Stage 7 smoke testing — see the identical
    # comment on scheduling-service above.
    build:
      context: .
      dockerfile: services/roi-service/Dockerfile
    env_file:
      # Optional on purpose. `.env` is no longer tracked (adr/0007), so a clean
      # clone does not have one — and a missing env_file is a HARD compose
      # error that fires before any `${VAR:?}` guard, producing "env file not
      # found" instead of the message naming the variable to set. Marking it
      # optional keeps the ${VAR:?} guards as the real fail-fast.
      - path: .env
        required: false
    environment:
      # Branch 7B: this service now verifies that a call came through the
      # gateway. Deliberately NOT in the committed .env — it is a secret, and
      # the ${VAR:?...} form makes a missing value stop compose rather than
      # start a service that 401s every real request.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env — see docs/runbook.md § Required one-time setup}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8076/healthz')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      GATEWAY_URL: http://gateway:8070
    ports:
      - "3070:3070"
    depends_on:
      - gateway

  # --- Observability profile (W10 Final Stage 7) --------------------------
  # Everything below is tagged `profiles: ["observability"]`, so a plain
  # `docker compose up` / `make up` is completely unaffected — these only
  # start with `docker compose --profile observability up` (or
  # `make up-observability`; see Makefile and docs/runbook.md). This is a
  # local observability POC (dashboards + 3 alert rules over real metrics
  # and logs), not a production monitoring deployment: no remote write, no
  # long-term storage, no alert routing/paging.
  prometheus:
    # OBS-B01 review fix: version pin corrected. Keep this version in sync
    # with docs/runbook.md and
    # observability/promtool_tests/alert_rules_test.yml's header comment —
    # see tests/test_observability_prometheus_version.py.
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    environment:
      # Prometheus's own config parser does not substitute env vars, so the
      # command below renders observability/prometheus/prometheus.yml.template
      # into a writable path with `sed` before starting the real binary —
      # see that template's header comment.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env — see docs/runbook.md § Required one-time setup}
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        sed "s#\$${INTERNAL_SERVICE_TOKEN}#$$INTERNAL_SERVICE_TOKEN#g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    depends_on:
      gateway:
        condition: service_started
      records-service:
        condition: service_started
      scheduling-service:
        condition: service_started
      roi-service:
        condition: service_started

  loki:
    image: grafana/loki:3.1.1
    profiles: ["observability"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]

  alloy:
    image: grafana/alloy:v1.4.3
    profiles: ["observability"]
    environment:
      # OBS-M01 review fix: not a secret — the resolved Compose project
      # name, used by observability/alloy/config.alloy's discovery.relabel
      # "keep" rule to scope Docker-socket discovery to this project's own
      # containers only. Compose always resolves this (from -p, the
      # COMPOSE_PROJECT_NAME env var, or the project directory name) even
      # when nothing sets it explicitly.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
  prometheus_data:
  loki_data:
