# Temporary, narrow vulnerability baseline (P5 follow-up).
#
# Pre-existing findings shared identically by all 7 backend service images
# (eligibility-service, gateway, intake-service, interop-service,
# records-service, roi-service, scheduling-service), all built FROM the same
# unpinned python:3.12-slim base. One entry per unique CVE, scoped by exact
# package PURL (purls: applies across every image scanned with this file --
# no per-image duplication needed). Fixable (a fixed version exists per
# Trivy's own scan output), temporary: remediation is pinning python:3.12-slim
# to an explicit digest (P5 follow-up, item 3), tracked to land and this file
# deleted before 2026-09-02. CRITICAL/HIGH findings NOT listed here still fail
# the build.
#
# Malformed YAML here must fail CI -- see the validate-ignore-files job.
vulnerabilities:
  - id: CVE-2026-53612
    purls: ["pkg:deb/debian/bsdutils", "pkg:deb/debian/libblkid1", "pkg:deb/debian/liblastlog2-2", "pkg:deb/debian/libmount1", "pkg:deb/debian/libsmartcols1", "pkg:deb/debian/libuuid1", "pkg:deb/debian/login", "pkg:deb/debian/mount", "pkg:deb/debian/util-linux"]
